name: Build KS Kasir Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KS-Kasir-Pro-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
